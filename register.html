<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация — Salary Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("salary-tracker-theme") || "light";
    </script>
  </head>
  <body class="auth-body" data-auth="register">
    <main class="auth-card">
      <h1>Регистрация</h1>
      <p>Создайте аккаунт, данные будут храниться в облаке</p>
      <form id="auth-form">
        <label class="field">
          Email
          <input name="email" type="email" required autocomplete="email" />
        </label>
        <label class="field">
          Пароль
          <input name="password" type="password" required minlength="6" autocomplete="new-password" />
        </label>
        <div id="auth-error" class="form-error"></div>
        <button class="btn" type="submit">Создать аккаунт</button>
      </form>
      <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </main>
    <script type="module" src="js/auth-page.js"></script>
  </body>
</html>
